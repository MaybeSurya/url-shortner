<!DOCTYPE html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Surya's URL Shortening Service</title>
    <meta name="description" content="Fast, reliable and privacy-focused link management built for developers, businesses and creators." />
    <meta name="theme-color" content="#0b0c0e" />
    <link rel="canonical" href="https://sury.cc" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    
    <!-- Open Graph / Social Sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://sury.cc" />
    <meta property="og:title" content="Surya's URL Shortener — Fast, Private Link Management" />
    <meta property="og:description" content="Fast, reliable and privacy-focused link management built for developers, businesses and creators." />
    <meta property="og:site_name" content="SURYA" />
    
    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Surya's URL Shortener — Fast, Private Link Management" />
    <meta name="twitter:description" content="Fast, reliable and privacy-focused link management built for developers, businesses and creators." />
    <script>
      (function(){try{var t=localStorage.getItem('app-theme')||'system';var d=t==='dark'||(t==='system'&&window.matchMedia('(prefers-color-scheme: dark)').matches);if(d)document.documentElement.classList.add('dark');else document.documentElement.classList.remove('dark');}catch(e){}})();
    </script>
  </head>
  <body class="h-full bg-background text-on-background antialiased selection:bg-primary/20 selection:text-primary transition-colors duration-200">
    <div id="root" class="h-full min-h-screen flex flex-col">
      <div class="min-h-screen bg-background text-on-background relative overflow-x-hidden flex flex-col">
        <a href="#main-content" class="sr-only focus:not-sr-only focus:absolute focus:top-3 focus:left-4 focus:z-50 focus:px-4 focus:py-2 focus:bg-primary focus:text-white focus:rounded-lg focus:shadow-lg focus:text-xs focus:font-semibold">
          Skip to main content
        </a>
        <header class="sticky top-0 z-50 w-full">
          <div class="mx-auto max-w-5xl px-4 sm:px-6 py-3">
            <div class="flex items-center justify-between h-12 px-4 rounded-xl border border-outline-variant/70 bg-surface-container-lowest/85 backdrop-blur-xl shadow-xs">
              <a href="/" class="group flex items-center" aria-label="SURYA home">
                <span class="font-mono font-bold tracking-[0.18em] uppercase select-none text-sm text-on-surface" style="letter-spacing:0.2em">SURYA</span>
              </a>
              <nav class="hidden md:flex items-center gap-1" aria-label="Primary navigation">
                <a href="/" class="px-3 py-1.5 text-xs font-medium text-on-surface-variant hover:text-on-surface hover:bg-surface-container rounded-md transition-all duration-150">Home</a>
                <a href="https://github.com/thedevs-network/kutt" target="_blank" rel="noreferrer" class="px-3 py-1.5 text-xs font-medium text-on-surface-variant hover:text-on-surface hover:bg-surface-container rounded-md transition-all duration-150 inline-flex items-center gap-1">Documentation</a>
              </nav>
            </div>
          </div>
        </header>
        <main id="main-content" class="flex-1 flex flex-col">
          <section aria-labelledby="hero-title" class="flex-1 flex items-center justify-center px-4 sm:px-6 py-24 md:py-36">
            <div class="max-w-2xl mx-auto text-center space-y-8">
              <div>
                <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[11px] font-medium tracking-wide text-on-surface-variant border border-outline-variant/80 bg-surface-container-low/60">
                  <span class="w-1.5 h-1.5 rounded-full bg-secondary animate-pulse"></span>
                  Internal Platform · Private Access
                </span>
              </div>
              <div class="space-y-4">
                <h1 id="hero-title" class="flex items-center justify-center">
                  <span class="font-mono font-bold tracking-[0.18em] uppercase select-none text-4xl sm:text-6xl md:text-7xl text-on-surface" style="letter-spacing:0.2em">SURYA</span>
                </h1>
                <p class="text-sm sm:text-base text-on-surface-variant leading-relaxed max-w-lg mx-auto">
                  A private URL shortening platform built for speed, reliability, and simplicity. Every link, tracked. Every redirect, instant.
                </p>
              </div>
            </div>
          </section>
          <section aria-label="Platform Statistics" class="border-t border-outline-variant/60">
            <div class="max-w-4xl mx-auto px-4 sm:px-6 py-10">
              <div class="flex flex-wrap items-center justify-center divide-x divide-outline-variant/50">
                <div class="flex flex-col items-center gap-0.5 px-6 md:px-10"><span class="text-xl md:text-2xl font-semibold font-mono text-on-surface tracking-tight">&lt; 5ms</span><span class="text-xs text-on-surface-variant">Redirect latency</span></div>
                <div class="flex flex-col items-center gap-0.5 px-6 md:px-10"><span class="text-xl md:text-2xl font-semibold font-mono text-on-surface tracking-tight">100%</span><span class="text-xs text-on-surface-variant">Uptime SLA</span></div>
                <div class="flex flex-col items-center gap-0.5 px-6 md:px-10"><span class="text-xl md:text-2xl font-semibold font-mono text-on-surface tracking-tight">Private</span><span class="text-xs text-on-surface-variant">No public access</span></div>
                <div class="flex flex-col items-center gap-0.5 px-6 md:px-10"><span class="text-xl md:text-2xl font-semibold font-mono text-on-surface tracking-tight">Crafted</span><span class="text-xs text-on-surface-variant">Built with care</span></div>
              </div>
            </div>
          </section>
        </main>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
